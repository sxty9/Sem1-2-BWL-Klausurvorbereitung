<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BWL Klausurvorbereitung</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #f87171;
    --ok: #4ade80;
    --warn: #fbbf24;
    --radius: 10px;
    --shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,23,42,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .2px; }
  header h1 .accent { color: var(--accent); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status-pill { font-size: 11px; color: var(--muted); padding: 2px 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; }
  .status-pill.ok { color: var(--ok); border-color: #1f4732; }
  .status-pill.err { color: var(--danger); border-color: #553030; }
  button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s;
  }
  button:hover { background: #334155; border-color: #475569; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #7dd3fc; }
  button.primary:disabled { background: var(--ok); color: #0f172a; border-color: var(--ok); cursor: default; opacity: .9; }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: #553030; }
  button.danger:hover { background: #2a1717; }
  button.small { padding: 4px 8px; font-size: 12px; }
  .save-btn { min-width: 150px; }
  .save-btn .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #0f172a; vertical-align: middle; }
  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 22px;
    padding: 22px;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  section.panel > .head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  section.panel > .head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  section.panel > .head .sub { color: var(--muted); font-size: 12px; }

  .topics { display: flex; flex-direction: column; }
  .topic {
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .topic:last-child { border-bottom: none; }
  .topic .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .topic .drag { cursor: grab; user-select: none; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
  .topic .drag:hover { background: var(--panel-2); color: var(--text); }
  .topic input.title {
    flex: 1; min-width: 200px;
    background: transparent; color: var(--text);
    border: none; border-bottom: 1px dashed transparent;
    font-size: 15px; font-weight: 600;
    padding: 6px 4px; outline: none;
  }
  .topic input.title:hover, .topic input.title:focus { border-bottom-color: var(--border); }
  .topic input.loc {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; font-size: 12px;
    width: 180px; outline: none;
  }
  .topic input.loc:focus { color: var(--text); border-color: var(--accent); }
  .topic textarea.notes {
    width: 100%; min-height: 60px; max-height: 500px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 13px;
    font-family: inherit; resize: vertical; outline: none;
    overflow: auto;
  }
  .topic textarea.notes:focus { border-color: var(--accent); }
  .attachments { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .attachment {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 4px 4px 10px;
    font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    max-width: 100%;
  }
  .attachment.pending { border-color: var(--warn); }
  .attachment .name {
    color: var(--accent); text-decoration: none; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px;
  }
  .attachment .name:hover { text-decoration: underline; }
  .attachment .src {
    color: var(--muted); font-size: 10px; text-transform: uppercase;
    background: rgba(255,255,255,.04); padding: 1px 5px; border-radius: 4px;
  }
  .attachment.pending .src { color: var(--warn); background: rgba(251,191,36,.1); }
  .attachment .rm {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 6px;
  }
  .attachment .rm:hover { color: var(--danger); }
  .attach-menu { display: inline-block; }
  .attach-menu-popup {
    position: fixed;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow);
    min-width: 260px; max-width: 380px; max-height: 320px; overflow-y: auto;
    z-index: 1000; padding: 4px;
  }
  .attach-menu-popup button {
    width: 100%; text-align: left; border: none; background: transparent;
    padding: 7px 10px; border-radius: 6px; font-size: 13px;
  }
  .attach-menu-popup button:hover { background: var(--border); }
  .attach-menu-popup .label { font-size: 11px; color: var(--muted); padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: .5px; }
  .topic .actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .topic .actions [data-act="anki"] {
    width: 62px; height: 28px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 5px; flex-shrink: 0; line-height: 1;
  }

  /* Anki cards dialog */
  #ankiDlg { max-width: 720px; width: 96%; padding: 0; overflow: hidden; }
  #ankiDlg .anki-head {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  #ankiDlg .anki-head h3 { margin: 0; font-size: 15px; }
  #ankiDlg .anki-head .sub { color: var(--muted); font-size: 12px; }
  .anki-cards { max-height: 55vh; overflow-y: auto; }
  .card-row {
    display: grid; grid-template-columns: 1fr 1fr auto;
    gap: 8px; padding: 10px 20px;
    border-bottom: 1px solid var(--border); align-items: start;
  }
  .card-row:last-child { border-bottom: none; }
  .card-row input, .card-row textarea {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 13px; outline: none;
    font-family: inherit; resize: vertical; min-height: 38px; max-height: 200px;
  }
  .card-row input:focus, .card-row textarea:focus { border-color: var(--accent); }
  .card-row input::placeholder, .card-row textarea::placeholder { color: var(--muted); }
  .card-row .rm {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 16px; padding: 6px; line-height: 1; margin-top: 4px;
  }
  .card-row .rm:hover { color: var(--danger); }
  .card-row-header {
    display: grid; grid-template-columns: 1fr 1fr auto;
    gap: 8px; padding: 8px 20px;
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
    border-bottom: 1px solid var(--border);
  }
  .card-row-header span:last-child { width: 28px; }
  .anki-foot {
    padding: 14px 20px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    flex-wrap: wrap; background: rgba(255,255,255,.02);
  }
  .anki-foot .left { display: flex; gap: 8px; align-items: center; }
  .anki-foot .count { font-size: 12px; color: var(--muted); }
  .anki-badge {
    box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 16px; padding: 0;
    font-size: 10px; font-weight: 700; line-height: 1;
    border-radius: 999px;
    background: var(--accent); color: #0f172a;
    border: 1px solid var(--accent);
    flex-shrink: 0;
  }
  .anki-badge.is-empty { background: transparent; border: 1px dashed var(--border); color: var(--muted); }

  .add-row {
    padding: 14px 18px;
    display: flex; gap: 8px; border-top: 1px solid var(--border);
    background: rgba(255,255,255,.02);
  }
  .add-row input {
    flex: 1; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 13px; outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }

  .ludolph { display: flex; flex-direction: column; }
  .spruch {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .spruch:last-child { border-bottom: none; }
  .spruch .num { color: var(--muted); font-size: 12px; min-width: 22px; margin-top: 7px; }
  .spruch textarea {
    flex: 1;
    background: transparent;
    border: 1px dashed transparent;
    color: var(--text); font-size: 14px; font-family: inherit;
    padding: 6px 8px; border-radius: 6px;
    resize: vertical; min-height: 36px; max-height: 500px; outline: none;
    line-height: 1.45; overflow: auto;
  }
  .spruch textarea:hover { border-color: var(--border); }
  .spruch textarea:focus { border-color: var(--accent); background: var(--panel-2); border-style: solid; }
  .spruch .rm {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; padding: 4px 6px; font-size: 16px;
  }
  .spruch .rm:hover { color: var(--danger); }

  .empty { padding: 30px; text-align: center; color: var(--muted); font-style: italic; font-size: 13px; }
  .hint { font-size: 11px; color: var(--muted); padding: 6px 18px 14px; }

  dialog {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
    max-width: 520px; width: 92%; max-height: 90vh;
    padding: 22px;
  }
  dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
  dialog h3 { margin: 0 0 10px; }
  dialog p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  dialog ul { padding-left: 18px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  dialog code { background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 4px; font-size: 12px; color: var(--text); }
  dialog .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    box-shadow: var(--shadow);
    opacity: 0; transition: opacity .25s, transform .25s;
    z-index: 1000; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  .toast.ok { border-color: var(--ok); color: var(--ok); }
  .toast.warn { border-color: var(--warn); color: var(--warn); }

  #historyDlg { max-width: 600px; }
  #historyDlg h3 { margin: 0 0 4px; }
  .history-entry {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .history-entry.current { border-color: var(--ok); }
  .history-entry .he-info { flex: 1; min-width: 0; }
  .history-entry .he-date { font-size: 11px; color: var(--muted); }
  .history-entry .he-msg  { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-entry .he-author { font-size: 11px; color: var(--accent); }
  .history-entry .he-current { font-size: 11px; color: var(--ok); font-weight: 600; }

  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(2px);
  }
  .loading-overlay.show { display: flex; }
  .loading-overlay .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 28px;
    font-size: 14px; color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>BWL Klausurvorbereitung</h1>
  <div class="toolbar">
    <span class="status-pill" id="statusPill">…</span>
    <button class="ghost small" id="btnHistory" title="Versionen / Rollback">⏱ Versionen</button>
    <button class="ghost small" id="btnReload" title="Neu laden">↻</button>
    <button class="ghost small" id="btnDiscard" style="display:none">Verwerfen</button>
    <button class="primary save-btn" id="btnSave"><span class="dot"></span><span id="saveLabel">Gespeichert</span></button>
  </div>
</header>

<main>
  <section class="panel">
    <div class="head">
      <h2>Klausurrelevante Themen</h2>
    </div>
    <div class="topics" id="topics"></div>
    <div class="add-row">
      <input id="newTopicInput" type="text" placeholder="Neues Thema…">
      <button class="primary" id="btnAddTopic">+ Thema</button>
    </div>
    <div class="add-row" style="justify-content:center">
      <button id="btnExportAll">Alle Karteikarten exportieren (.apkg)</button>
    </div>
  </section>

  <section class="panel">
    <div class="head">
      <h2>Ludolph Sprüche</h2>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="small" id="btnExportLudolph" title="Sprüche als Anki-Karteikarten exportieren">Anki Export</button>
        <button class="primary small" id="btnAddSpruch">+ Spruch</button>
      </div>
    </div>
    <div class="ludolph" id="ludolph"></div>
  </section>
</main>

<dialog id="ankiDlg">
  <div class="anki-head">
    <div>
      <h3 id="ankiTitle">Anki Karteikarten</h3>
      <div class="sub" id="ankiSub"></div>
    </div>
    <button class="ghost small" id="closeAnki">Schließen</button>
  </div>
  <div class="card-row-header"><span>Vorderseite</span><span>Rückseite</span><span></span></div>
  <div class="anki-cards" id="ankiCards"></div>
  <div class="anki-foot">
    <div class="left">
      <button class="small primary" id="ankiAddCard">+ Karte</button>
      <span class="count" id="ankiCount"></span>
    </div>
    <button class="small" id="ankiExport">Exportieren (.apkg)</button>
  </div>
</dialog>

<dialog id="historyDlg">
  <h3>Versionen</h3>
  <div id="historyList" style="margin:14px 0; display:flex; flex-direction:column; gap:6px; max-height:420px; overflow-y:auto;"></div>
  <div style="display:flex; justify-content:flex-end; margin-top:8px;">
    <button id="closeHistory">Schließen</button>
  </div>
</dialog>

<input type="file" id="filePicker" style="display:none">
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="box" id="loadingText">Lade…</div></div>

<script>
"use strict";

const LOCAL_CACHE_KEY = "bwl-klausur-cache";
const NOTES_DIR = "notes";

let state = { topics: [], ludolph: [] };
let baseSha = null;
let dirty = false;
let pendingUploads = new Map(); // attachmentId -> File
let repoFiles = [];

// ============================================================
//  DOM helpers
// ============================================================

const $ = sel => document.querySelector(sel);
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function escapeText(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escapeAttr(s) { return escapeText(s).replace(/"/g, "&quot;"); }

let toastTimer = null;
function toast(msg, kind) {
  const el = $("#toast");
  el.className = "toast show " + (kind || "");
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast " + (kind || ""); }, 3000);
}

function showLoading(text) {
  $("#loadingText").textContent = text || "Lade…";
  $("#loadingOverlay").classList.add("show");
}
function hideLoading() { $("#loadingOverlay").classList.remove("show"); }

function setStatus(kind, text) {
  const el = $("#statusPill");
  el.className = "status-pill " + (kind || "");
  el.textContent = text;
}

function ensureIds() {
  state.topics.forEach(t => {
    if (!t.id) t.id = uid();
    if (!Array.isArray(t.attachments)) t.attachments = [];
    t.attachments.forEach(a => { if (!a.id) a.id = uid(); });
    if (!Array.isArray(t.cards)) t.cards = [];
    t.cards.forEach(c => { if (!c.id) c.id = uid(); });
  });
  state.ludolph.forEach(s => { if (!s.id) s.id = uid(); });
}

function markDirty() {
  dirty = true;
  updateSaveButton();
  try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ state, ts: Date.now() })); } catch (e) {}
}

function updateSaveButton() {
  const btn = $("#btnSave");
  const label = $("#saveLabel");
  const dot = btn.querySelector(".dot");
  const discard = $("#btnDiscard");
  if (dirty) {
    btn.disabled = false;
    label.textContent = "Speichern";
    dot.style.background = "#0f172a";
    discard.style.display = "";
  } else {
    btn.disabled = true;
    label.textContent = "✓ Gespeichert";
    dot.style.background = "transparent";
    discard.style.display = "none";
  }
}

// ============================================================
//  Backend calls
// ============================================================

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) {}
    const err = new Error(msg); err.status = res.status;
    throw err;
  }
  return res;
}

async function loadFromServer() {
  const r = await api("/api/data");
  const json = await r.json();
  state.topics = Array.isArray(json.state?.topics) ? json.state.topics : [];
  state.ludolph = Array.isArray(json.state?.ludolph) ? json.state.ludolph : [];
  ensureIds();
  baseSha = json.sha || null;
  try { localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ state, ts: Date.now() })); } catch (e) {}
}

async function loadRepoFiles() {
  try {
    const r = await api("/api/files");
    const json = await r.json();
    repoFiles = (json.files || []).map(p => ({ path: p, name: p.split("/").pop() }));
  } catch (e) {
    console.warn("loadRepoFiles", e);
    repoFiles = [];
  }
}

async function uploadBlob(path, file) {
  // Send raw binary — bypasses Vercel's 4.5MB JSON body limit
  const r = await api(`/api/upload?path=${encodeURIComponent(path)}`, {
    method: "POST",
    headers: { "Content-Type": "application/octet-stream" },
    body: file
  });
  return (await r.json()).sha;
}

// ============================================================
//  Save flow
// ============================================================

async function save() {
  if (!dirty) return;
  const btn = $("#btnSave");
  const label = $("#saveLabel");
  btn.disabled = true;
  label.textContent = "Speichere…";

  try {
    // Upload pending files first → collect SHAs
    const fileShas = [];
    let i = 0;
    for (const [attId, file] of pendingUploads) {
      i++;
      label.textContent = `Lade ${i}/${pendingUploads.size}…`;
      // Find attachment + resolve collision
      let att = null;
      for (const t of state.topics) {
        const a = t.attachments.find(x => x.id === attId);
        if (a) { att = a; break; }
      }
      if (!att) continue;
      let path = att.path;
      while (repoFiles.some(rf => rf.path === path)) {
        const dot = path.lastIndexOf(".");
        const slash = path.lastIndexOf("/");
        const stem = dot > slash ? path.slice(0, dot) : path;
        const ext = dot > slash ? path.slice(dot) : "";
        path = `${stem}-${Date.now().toString(36)}${ext}`;
      }
      const sha = await uploadBlob(path, file);
      fileShas.push({ path, sha });
      att.name = path.split("/").pop();
      att.path = path;
      att.source = "repo";
    }

    label.textContent = "Commite…";
    const r = await api("/api/data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state, expectedSha: baseSha, fileShas })
    });
    const json = await r.json();
    baseSha = json.sha;
    pendingUploads.clear();
    dirty = false;
    updateSaveButton();
    await loadRepoFiles();
    render();
    toast(fileShas.length ? `Gespeichert ✓  (+ ${fileShas.length} Datei(en))` : "Gespeichert ✓", "ok");
    setStatus("ok", "Live");
  } catch (e) {
    console.error(e);
    dirty = true;
    updateSaveButton();
    if (e.status === 409) {
      toast(e.message, "err");
      setStatus("err", "Konflikt");
    } else {
      toast("Speichern fehlgeschlagen: " + e.message, "err");
      setStatus("err", "Offline?");
    }
  }
}

// ============================================================
//  Rendering
// ============================================================

function render() {
  renderTopics();
  renderLudolph();
}

function renderTopics() {
  const topicsEl = $("#topics");
  topicsEl.innerHTML = "";
  if (!state.topics.length) {
    topicsEl.innerHTML = `<div class="empty">Noch keine Themen.</div>`;
    return;
  }
  state.topics.forEach((t, idx) => {
    const el = document.createElement("div");
    el.className = "topic";
    el.dataset.id = t.id;
    const cardCount = (t.cards || []).length;
    el.innerHTML = `
      <div class="row">
        <span class="drag" title="Ziehen zum Sortieren">⋮⋮</span>
        <input class="title" type="text" value="${escapeAttr(t.title)}" placeholder="Thema…">
        <input class="loc" type="text" value="${escapeAttr(t.location || "")}" placeholder="z.B. Satz 1, S. 86">
        <div class="actions">
          <button class="small ghost" data-act="anki" title="Anki Karteikarten">🗂 <span class="anki-badge ${cardCount ? "" : "is-empty"}">${cardCount}</span></button>
          <button class="small ghost" data-act="up" title="Hoch">↑</button>
          <button class="small ghost" data-act="down" title="Runter">↓</button>
          <button class="small danger" data-act="del" title="Löschen">✕</button>
        </div>
      </div>
      <textarea class="notes" placeholder="Notizen, Stichpunkte, Formeln…">${escapeText(t.notes || "")}</textarea>
      <div class="attachments" data-attachments></div>
    `;
    el.querySelector("input.title").addEventListener("input", e => { t.title = e.target.value; markDirty(); });
    el.querySelector("input.loc").addEventListener("input",   e => { t.location = e.target.value; markDirty(); });
    const notesEl = el.querySelector("textarea.notes");
    if (t.notesHeight) notesEl.style.height = t.notesHeight;
    notesEl.addEventListener("input", e => { t.notes = e.target.value; markDirty(); });
    notesEl.addEventListener("pointerup", () => {
      const h = notesEl.style.height;
      if (h && h !== t.notesHeight) { t.notesHeight = h; markDirty(); }
    });
    el.querySelector("[data-act='del']").addEventListener("click", () => {
      if (confirm(`Thema "${t.title}" wirklich löschen?`)) {
        t.attachments.forEach(a => pendingUploads.delete(a.id));
        state.topics.splice(idx, 1);
        markDirty(); render();
      }
    });
    el.querySelector("[data-act='up']").addEventListener("click", () => moveTopic(idx, -1));
    el.querySelector("[data-act='down']").addEventListener("click", () => moveTopic(idx, +1));
    el.querySelector("[data-act='anki']").addEventListener("click", () => openAnkiDialog(t));

    const drag = el.querySelector(".drag");
    drag.addEventListener("mousedown", () => { el.draggable = true; });
    el.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", t.id);
      e.dataTransfer.effectAllowed = "move";
      el.style.opacity = ".5";
    });
    el.addEventListener("dragend", () => { el.style.opacity = "1"; el.draggable = false; });
    el.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
    el.addEventListener("drop", e => {
      e.preventDefault();
      const fromId = e.dataTransfer.getData("text/plain");
      if (!fromId || fromId === t.id) return;
      const fromIdx = state.topics.findIndex(x => x.id === fromId);
      const toIdx = state.topics.findIndex(x => x.id === t.id);
      if (fromIdx < 0 || toIdx < 0) return;
      const [item] = state.topics.splice(fromIdx, 1);
      state.topics.splice(toIdx, 0, item);
      markDirty(); render();
    });

    renderAttachments(el.querySelector("[data-attachments]"), t);
    topicsEl.appendChild(el);
  });
}

function moveTopic(idx, delta) {
  const to = idx + delta;
  if (to < 0 || to >= state.topics.length) return;
  const [item] = state.topics.splice(idx, 1);
  state.topics.splice(to, 0, item);
  markDirty(); render();
}

function renderAttachments(container, topic) {
  container.innerHTML = "";
  topic.attachments.forEach(att => {
    const isPending = pendingUploads.has(att.id);
    const chip = document.createElement("span");
    chip.className = "attachment" + (isPending ? " pending" : "");
    const srcLabel = isPending ? "ungespeichert" : "Repo";
    chip.innerHTML = `
      <a class="name" title="${escapeAttr(att.path || att.name)}">${escapeText(att.name)}</a>
      <span class="src">${srcLabel}</span>
      <button class="rm" title="Entfernen">×</button>
    `;
    chip.querySelector(".name").addEventListener("click", () => openAttachment(att));
    chip.querySelector(".rm").addEventListener("click", () => {
      pendingUploads.delete(att.id);
      topic.attachments = topic.attachments.filter(a => a.id !== att.id);
      markDirty(); render();
    });
    container.appendChild(chip);
  });

  const wrap = document.createElement("span");
  wrap.className = "attach-menu";
  wrap.innerHTML = `<button class="small">+ Datei</button>`;
  wrap.querySelector("button").addEventListener("click", e => {
    e.stopPropagation();
    openAttachMenu(wrap, topic);
  });
  container.appendChild(wrap);
}

function openAttachMenu(anchor, topic) {
  document.querySelectorAll(".attach-menu-popup").forEach(m => m.remove());
  const menu = document.createElement("div");
  menu.className = "attach-menu-popup";

  const localBtn = document.createElement("button");
  localBtn.textContent = "📤 Lokale Datei hochladen…";
  localBtn.addEventListener("click", () => { menu.remove(); uploadLocalFile(topic); });
  menu.appendChild(localBtn);

  if (repoFiles.length) {
    const lbl = document.createElement("div");
    lbl.className = "label";
    lbl.textContent = "Aus Repo";
    menu.appendChild(lbl);
    repoFiles.forEach(rf => {
      const b = document.createElement("button");
      b.textContent = "📄 " + rf.path;
      b.addEventListener("click", () => {
        menu.remove();
        if (topic.attachments.some(a => a.path === rf.path)) {
          toast("Datei ist bereits angehängt", "warn");
          return;
        }
        topic.attachments.push({ id: uid(), name: rf.name, path: rf.path, source: "repo" });
        markDirty(); render();
      });
      menu.appendChild(b);
    });
  }

  // Position fixed, tracking anchor on scroll
  document.body.appendChild(menu);

  function positionMenu() {
    const rect = anchor.getBoundingClientRect();
    const menuH = menu.offsetHeight;
    const menuW = menu.offsetWidth;
    const spaceBelow = window.innerHeight - rect.bottom;
    const top = (spaceBelow >= menuH || spaceBelow >= 120)
      ? rect.bottom + 4
      : rect.top - menuH - 4;
    menu.style.top  = Math.max(8, top) + "px";
    menu.style.left = Math.min(rect.left, window.innerWidth - menuW - 8) + "px";
  }
  positionMenu();
  window.addEventListener("scroll", positionMenu, { passive: true });

  setTimeout(() => {
    const close = e => {
      if (!menu.contains(e.target) && e.target !== anchor) {
        menu.remove();
        window.removeEventListener("scroll", positionMenu);
        document.removeEventListener("click", close);
      }
    };
    document.addEventListener("click", close);
  }, 0);
}

function uploadLocalFile(topic) {
  const picker = $("#filePicker");
  picker.value = "";
  picker.onchange = () => {
    const file = picker.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
      toast("Datei > 50 MB — zu groß für den Upload", "err");
      return;
    }
    const id = uid();
    topic.attachments.push({
      id, name: file.name, path: `${NOTES_DIR}/${file.name}`, source: "local-pending"
    });
    pendingUploads.set(id, file);
    markDirty(); render();
    toast("Wird beim Speichern hochgeladen", "warn");
  };
  picker.click();
}

async function openAttachment(att) {
  if (pendingUploads.has(att.id)) {
    const file = pendingUploads.get(att.id);
    const url = URL.createObjectURL(file);
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
    return;
  }
  if (att.path) window.open(`/api/file?path=${encodeURIComponent(att.path)}`, "_blank");
}

function renderLudolph() {
  const ludolphEl = $("#ludolph");
  ludolphEl.innerHTML = "";
  if (!state.ludolph.length) {
    ludolphEl.innerHTML = `<div class="empty">Noch keine Sprüche.</div>`;
    return;
  }
  state.ludolph.forEach((s, idx) => {
    const el = document.createElement("div");
    el.className = "spruch";
    el.innerHTML = `
      <span class="num">${idx + 1}.</span>
      <textarea placeholder="Spruch eingeben…">${escapeText(s.text || "")}</textarea>
      <button class="rm" title="Entfernen">✕</button>
    `;
    const ta = el.querySelector("textarea");
    if (s.height) ta.style.height = s.height;
    else autosize(ta);
    ta.addEventListener("input", e => { s.text = e.target.value; autosize(ta); markDirty(); });
    ta.addEventListener("pointerup", () => {
      const h = ta.style.height;
      if (h && h !== s.height) { s.height = h; markDirty(); }
    });
    el.querySelector(".rm").addEventListener("click", () => {
      state.ludolph.splice(idx, 1);
      markDirty(); render();
    });
    ludolphEl.appendChild(el);
  });
}
function autosize(ta) { ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; }

// ============================================================
//  Anki cards dialog
// ============================================================

let ankiTopic = null; // currently open topic in dialog

function openAnkiDialog(topic) {
  ankiTopic = topic;
  if (!Array.isArray(topic.cards)) topic.cards = [];
  $("#ankiTitle").textContent = "Anki — " + (topic.title || "Unbenannt");
  $("#ankiSub").textContent = topic.location || "";
  renderAnkiCards();
  $("#ankiDlg").showModal();
}

function renderAnkiCards() {
  const t = ankiTopic;
  if (!t) return;
  const cards = t.cards;
  const container = $("#ankiCards");
  container.innerHTML = "";

  if (!cards.length) {
    container.innerHTML = `<div class="empty">Noch keine Karten. Klick auf "+ Karte".</div>`;
  } else {
    cards.forEach((card, ci) => {
      const row = document.createElement("div");
      row.className = "card-row";
      row.innerHTML = `
        <textarea placeholder="Vorderseite" rows="1">${escapeText(card.front || "")}</textarea>
        <textarea placeholder="Rückseite" rows="1">${escapeText(card.back || "")}</textarea>
        <button class="rm" title="Karte löschen">×</button>
      `;
      const [frontTA, backTA] = row.querySelectorAll("textarea");
      autosize(frontTA); autosize(backTA);
      frontTA.addEventListener("input", e => { card.front = e.target.value; autosize(frontTA); markDirty(); });
      backTA.addEventListener("input", e => { card.back = e.target.value; autosize(backTA); markDirty(); });
      row.querySelector(".rm").addEventListener("click", () => {
        cards.splice(ci, 1);
        markDirty(); renderAnkiCards(); render();
      });
      container.appendChild(row);
    });
  }
  $("#ankiCount").textContent = `${cards.length} Karte${cards.length !== 1 ? "n" : ""}`;
  $("#ankiExport").disabled = !cards.length;
}

$("#ankiAddCard").addEventListener("click", () => {
  if (!ankiTopic) return;
  ankiTopic.cards.push({ id: uid(), front: "", back: "" });
  markDirty(); renderAnkiCards(); render();
  // Focus the new front textarea
  const rows = $("#ankiCards").querySelectorAll(".card-row");
  if (rows.length) rows[rows.length - 1].querySelector("textarea").focus();
});

$("#ankiExport").addEventListener("click", () => {
  if (ankiTopic) exportAnki(ankiTopic);
});

$("#closeAnki").addEventListener("click", () => {
  $("#ankiDlg").close();
  ankiTopic = null;
});

async function exportAnki(topic) {
  if (!topic.cards || !topic.cards.length) {
    toast("Keine Karten zum Exportieren", "warn");
    return;
  }
  const deckName = "BWL - " + (topic.title || "Unbenannt");
  const cards = topic.cards
    .filter(c => c.front && c.front.trim())
    .map(c => ({ front: c.front, back: c.back || "" }));
  if (!cards.length) {
    toast("Keine Karten mit Inhalt", "warn");
    return;
  }
  await downloadApkg({ deckName, cards });
}

async function exportAllAnki() {
  const decks = state.topics
    .filter(t => t.cards && t.cards.length && t.cards.some(c => c.front && c.front.trim()))
    .map(t => ({
      name: "BWL Klausur::" + (t.title || "Unbenannt"),
      cards: t.cards.filter(c => c.front && c.front.trim()).map(c => ({ front: c.front, back: c.back || "" }))
    }));
  if (!decks.length) {
    toast("Keine Karteikarten in keinem Thema vorhanden", "warn");
    return;
  }
  await downloadApkg({ decks });
}

// Split a Spruch into front/back for Anki
function splitSpruch(text) {
  text = (text || "").trim();
  if (!text) return null;
  const mid = Math.floor(text.length / 2);
  // Find all comma positions
  const commas = [];
  for (let i = 0; i < text.length; i++) {
    if (text[i] === ",") commas.push(i);
  }
  // Pick the comma closest to the middle
  let splitPos = -1;
  if (commas.length) {
    let best = -1, bestDist = Infinity;
    for (const ci of commas) {
      const dist = Math.abs(ci - mid);
      if (dist < bestDist) { bestDist = dist; best = ci; }
    }
    // Split after the comma (include comma on the front side)
    splitPos = best + 1;
  }
  // No comma found: split at the word boundary closest to the middle
  if (splitPos < 0) {
    const spaces = [];
    for (let i = 0; i < text.length; i++) {
      if (text[i] === " ") spaces.push(i);
    }
    if (spaces.length) {
      let best = -1, bestDist = Infinity;
      for (const si of spaces) {
        const dist = Math.abs(si - mid);
        if (dist < bestDist) { bestDist = dist; best = si; }
      }
      splitPos = best;
    }
  }
  // Fallback: just split at the middle
  if (splitPos < 0) splitPos = mid;
  const front = text.slice(0, splitPos).trim();
  const back = text.slice(splitPos).trim();
  if (!front || !back) return { front: text, back: "..." };
  return { front: front, back: back };
}

async function exportLudolphAnki() {
  const sprueche = (state.ludolph || []).filter(s => s.text && s.text.trim());
  if (!sprueche.length) {
    toast("Keine Sprüche zum Exportieren", "warn");
    return;
  }
  const cards = sprueche.map(s => splitSpruch(s.text)).filter(Boolean);
  await downloadApkg({ deckName: "Ludolph Sprüche", cards });
}

async function downloadApkg(body) {
  try {
    toast("Generiere .apkg…");
    const res = await fetch("/api/anki", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      let msg = `${res.status}`;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const cd = res.headers.get("Content-Disposition") || "";
    let filename = "anki-export.apkg";
    const m = cd.match(/filename\*?=(?:UTF-8'')?([^;\s]+)/i);
    if (m) filename = decodeURIComponent(m[1]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast("Export fertig ✓", "ok");
  } catch (e) {
    toast("Export fehlgeschlagen: " + e.message, "err");
  }
}

// ============================================================
//  Version history + rollback
// ============================================================

async function openHistory() {
  const dlg = $("#historyDlg");
  const list = $("#historyList");
  list.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:8px 0">Lade Versionen…</div>`;
  dlg.showModal();
  try {
    const r = await api("/api/history?limit=30");
    const { commits } = await r.json();
    list.innerHTML = "";
    if (!commits.length) {
      list.innerHTML = `<div style="color:var(--muted);font-size:13px">Keine Versionen gefunden.</div>`;
      return;
    }
    commits.forEach((c, idx) => {
      const isCurrent = c.sha === baseSha;
      const date = new Date(c.date).toLocaleString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
      const entry = document.createElement("div");
      entry.className = "history-entry" + (isCurrent ? " current" : "");
      entry.innerHTML = `
        <div class="he-info">
          <div class="he-msg">${escapeText(c.message)}</div>
          <div class="he-date">${date} · <span class="he-author">${escapeText(c.author)}</span>${isCurrent ? ' · <span class="he-current">✓ Aktuell</span>' : ""}</div>
        </div>
        ${!isCurrent ? `<button class="small danger" data-sha="${escapeAttr(c.sha)}">Wiederherstellen</button>` : ""}
      `;
      if (!isCurrent) {
        entry.querySelector("button").addEventListener("click", async () => {
          if (!confirm(`Auf diesen Stand zurückrollen?\n\n${c.message}\n(${date})\n\nAktuelle ungespeicherte Änderungen gehen verloren.`)) return;
          dlg.close();
          await rollbackTo(c.sha, c.message);
        });
      }
      list.appendChild(entry);
    });
  } catch (e) {
    list.innerHTML = `<div style="color:var(--danger);font-size:13px">Fehler: ${escapeText(e.message)}</div>`;
  }
}

async function rollbackTo(sha, label) {
  showLoading("Stelle wieder her…");
  try {
    // Load state from that commit
    const r = await api(`/api/history?sha=${encodeURIComponent(sha)}`);
    const { state: oldState } = await r.json();
    // Apply and save as new commit
    state.topics = Array.isArray(oldState.topics) ? oldState.topics : [];
    state.ludolph = Array.isArray(oldState.ludolph) ? oldState.ludolph : [];
    ensureIds();
    // Force-save immediately (no dirty check, use current baseSha)
    const saveR = await api("/api/data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state, expectedSha: baseSha, fileShas: [] })
    });
    const json = await saveR.json();
    baseSha = json.sha;
    pendingUploads.clear();
    dirty = false;
    updateSaveButton();
    await loadRepoFiles();
    render();
    setStatus("ok", "Live");
    toast(`Wiederhergestellt ✓`, "ok");
  } catch (e) {
    toast("Rollback fehlgeschlagen: " + e.message, "err");
  } finally {
    hideLoading();
  }
}

// ============================================================
//  Reload
// ============================================================

async function reload() {
  if (dirty) {
    if (!confirm("Du hast ungespeicherte Änderungen — wirklich verwerfen und neu laden?")) return;
  }
  try {
    showLoading("Lade vom Server…");
    await loadFromServer();
    await loadRepoFiles();
    pendingUploads.clear();
    dirty = false;
    updateSaveButton();
    render();
    setStatus("ok", "Live");
    toast("Neu geladen ✓", "ok");
  } catch (e) {
    toast("Laden fehlgeschlagen: " + e.message, "err");
    setStatus("err", "Offline?");
  } finally {
    hideLoading();
  }
}

// ============================================================
//  Wiring
// ============================================================

$("#btnSave").addEventListener("click", save);
$("#btnDiscard").addEventListener("click", reload);
$("#btnReload").addEventListener("click", reload);
$("#btnHistory").addEventListener("click", openHistory);
$("#closeHistory").addEventListener("click", () => $("#historyDlg").close());
$("#btnExportAll").addEventListener("click", exportAllAnki);
$("#btnExportLudolph").addEventListener("click", exportLudolphAnki);

$("#btnAddTopic").addEventListener("click", addTopicFromInput);
$("#newTopicInput").addEventListener("keydown", e => { if (e.key === "Enter") addTopicFromInput(); });
function addTopicFromInput() {
  const input = $("#newTopicInput");
  const title = input.value.trim();
  if (!title) return;
  state.topics.push({ id: uid(), title, location: "", notes: "", attachments: [], cards: [] });
  input.value = "";
  markDirty(); render();
}

$("#btnAddSpruch").addEventListener("click", () => {
  state.ludolph.push({ id: uid(), text: "" });
  markDirty(); render();
  const all = $("#ludolph").querySelectorAll("textarea");
  if (all.length) all[all.length - 1].focus();
});

window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (dirty) save(); }
});

// ============================================================
//  Init
// ============================================================

(async function init() {
  // Quick first paint from cache
  try {
    const cached = JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY) || "null");
    if (cached?.state?.topics) {
      state = cached.state;
      ensureIds();
      render();
    }
  } catch (e) {}

  setStatus("", "Lade…");
  showLoading("Lade Daten…");
  try {
    await loadFromServer();
    await loadRepoFiles();
    render();
    updateSaveButton();
    setStatus("ok", "Live");
  } catch (e) {
    console.error(e);
    setStatus("err", "Offline?");
    toast("Server nicht erreichbar: " + e.message, "err");
  } finally {
    hideLoading();
  }
})();
</script>
